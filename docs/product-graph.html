<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }

  #header { padding: 16px 24px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #header h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; white-space: nowrap; }
  #header .meta { font-size: 12px; color: #64748b; }

  #controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  select, button { background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  select:focus, button:hover { border-color: #6366f1; outline: none; }
  button { background: #1e3a5f; border-color: #3b82f6; }
  button:hover { background: #1d4ed8; }

  #legend { display: flex; gap: 12px; padding: 8px 24px; background: #1e293b; border-bottom: 1px solid #334155; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #94a3b8; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-diamond { width: 10px; height: 10px; transform: rotate(45deg); flex-shrink: 0; }

  #canvas { position: relative; }
  svg { display: block; }

  .node circle, .node rect, .node polygon { cursor: pointer; stroke-width: 1.5px; transition: opacity 0.2s; }
  .node text { pointer-events: none; fill: #e2e8f0; font-size: 11px; }
  .link { stroke: #475569; stroke-opacity: 0.6; fill: none; }
  .link.decided_by { stroke: #f97316; stroke-dasharray: 4 2; }
  .link.guards_against { stroke: #ef4444; }
  .link.implements { stroke: #10b981; stroke-dasharray: 2 2; }

  #tooltip {
    position: fixed; background: #1e293b; border: 1px solid #475569; border-radius: 8px;
    padding: 12px 14px; font-size: 12px; max-width: 280px; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #tooltip .tt-type { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 4px; }
  #tooltip .tt-label { font-weight: 600; color: #f1f5f9; margin-bottom: 6px; font-size: 13px; }
  #tooltip .tt-desc { color: #94a3b8; line-height: 1.5; margin-bottom: 6px; }
  #tooltip .tt-file { font-family: monospace; font-size: 10px; color: #6366f1; }
  #tooltip .tt-sprint { color: #64748b; font-size: 10px; margin-top: 4px; }
  #tooltip .tt-decision { background: #1c1917; border-left: 3px solid #f97316; padding: 6px 8px; border-radius: 4px; margin-top: 6px; font-size: 11px; color: #d6d3d1; }

  #stats { position: absolute; bottom: 16px; left: 16px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #64748b; }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>Product Knowledge Graph</h1>
    <div class="meta" id="meta-line">Loading…</div>
  </div>
  <div id="controls">
    <select id="filter-sprint"><option value="all">All Sprints</option></select>
    <select id="filter-type">
      <option value="all">All Types</option>
      <option value="service">Services</option>
      <option value="module">Modules</option>
      <option value="component">Components</option>
      <option value="function">Functions</option>
      <option value="api">APIs</option>
      <option value="database">Databases</option>
      <option value="decision">Decisions</option>
    </select>
    <button onclick="resetZoom()">Reset View</button>
  </div>
</div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> Service</div>
  <div class="legend-item"><div class="legend-dot" style="background:#6366f1"></div> Module</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div> Component</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div> Function</div>
  <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div> API</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Database</div>
  <div class="legend-item"><div class="legend-diamond" style="background:#f97316"></div> Decision</div>
</div>

<div id="canvas">
  <svg id="graph"></svg>
  <div id="stats"></div>
</div>
<div id="tooltip"></div>

<script>
// ── GRAPH DATA — regenerated by ARCHITECT at each GATE 5 ──────────────────
// ARCHITECT: replace this object with current product-graph.yaml data (serialized to JSON)
const GRAPH_DATA = {
  meta: { project: "Your Project", last_merge_sprint: 0, total_nodes: 0, total_edges: 0 },
  nodes: [
    // Example data — ARCHITECT replaces this at GATE 5
    { id: "example-service", type: "service", label: "Example Service", sprint: 1, description: "Replace this with real graph data at GATE 5." }
  ],
  edges: [],
  decisions: []
};
// ─────────────────────────────────────────────────────────────────────────

const NODE_COLORS = {
  service: "#3b82f6", module: "#6366f1", component: "#8b5cf6",
  function: "#a855f7", api: "#10b981", database: "#f59e0b", decision: "#f97316"
};
const NODE_RADIUS = {
  service: 22, module: 16, component: 13, function: 9, api: 13, database: 14, decision: 14
};

let allNodes = [], allEdges = [], simulation, svg, g, zoom, link, node;

function init() {
  const w = window.innerWidth, h = window.innerHeight - document.querySelector('#header').offsetHeight - document.querySelector('#legend').offsetHeight;
  document.getElementById('canvas').style.height = h + 'px';

  svg = d3.select('#graph').attr('width', w).attr('height', h);
  zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);
  g = svg.append('g');

  // Arrow markers
  const defs = svg.append('defs');
  ['default','decided_by','guards_against','implements'].forEach(t => {
    defs.append('marker').attr('id','arrow-'+t).attr('viewBox','0 -5 10 10')
      .attr('refX',20).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6)
      .attr('orient','auto')
      .append('path').attr('d','M0,-5L10,0L0,5')
      .attr('fill', t==='decided_by'?'#f97316': t==='guards_against'?'#ef4444': t==='implements'?'#10b981':'#475569');
  });

  allNodes = GRAPH_DATA.nodes.map(n => ({...n}));
  allEdges = GRAPH_DATA.edges.map(e => ({...e}));

  // Populate sprint filter
  const sprints = [...new Set(allNodes.map(n => n.sprint).filter(Boolean))].sort((a,b)=>a-b);
  const sel = document.getElementById('filter-sprint');
  sprints.forEach(s => { const o = document.createElement('option'); o.value=s; o.textContent='Sprint '+s; sel.appendChild(o); });

  document.getElementById('filter-sprint').addEventListener('change', render);
  document.getElementById('filter-type').addEventListener('change', render);

  document.getElementById('meta-line').textContent =
    `${GRAPH_DATA.meta.project} · Sprint ${GRAPH_DATA.meta.last_merge_sprint} · ${allNodes.length} nodes · ${allEdges.length} edges`;

  render();
}

function render() {
  const sprintFilter = document.getElementById('filter-sprint').value;
  const typeFilter = document.getElementById('filter-type').value;

  let nodes = allNodes.filter(n =>
    (sprintFilter === 'all' || String(n.sprint) === sprintFilter) &&
    (typeFilter === 'all' || n.type === typeFilter)
  );
  const nodeIds = new Set(nodes.map(n => n.id));
  let edges = allEdges.filter(e => nodeIds.has(e.from) && nodeIds.has(e.to));

  document.getElementById('stats').textContent = `${nodes.length} nodes · ${edges.length} edges`;

  g.selectAll('*').remove();
  if (simulation) simulation.stop();

  const w = +svg.attr('width'), h = +svg.attr('height');

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(d => {
      const types = [d.source.type, d.target.type];
      if (types.includes('function')) return 60;
      if (types.includes('service')) return 140;
      return 100;
    }))
    .force('charge', d3.forceManyBody().strength(d => d.type === 'service' ? -400 : -180))
    .force('center', d3.forceCenter(w/2, h/2))
    .force('collision', d3.forceCollide().radius(d => NODE_RADIUS[d.type] + 8));

  link = g.append('g').selectAll('line').data(edges).join('line')
    .attr('class', d => 'link ' + (d.type || ''))
    .attr('marker-end', d => `url(#arrow-${d.type || 'default'})`);

  node = g.append('g').selectAll('.node').data(nodes).join('g')
    .attr('class', 'node')
    .call(d3.drag().on('start', dragStart).on('drag', dragged).on('end', dragEnd))
    .on('mouseover', showTooltip)
    .on('mousemove', moveTooltip)
    .on('mouseout', hideTooltip);

  // Render shapes by type
  node.each(function(d) {
    const el = d3.select(this);
    const r = NODE_RADIUS[d.type] || 12;
    const c = NODE_COLORS[d.type] || '#64748b';
    if (d.type === 'decision') {
      el.append('polygon')
        .attr('points', `0,${-r*1.3} ${r*1.1},0 0,${r*1.3} ${-r*1.1},0`)
        .attr('fill', c).attr('stroke', '#fff').attr('stroke-opacity', 0.3);
    } else if (d.type === 'api') {
      el.append('rect')
        .attr('x', -r*1.4).attr('y', -r*0.7).attr('width', r*2.8).attr('height', r*1.4)
        .attr('rx', 4).attr('fill', c).attr('stroke', '#fff').attr('stroke-opacity', 0.2);
    } else {
      el.append('circle').attr('r', r).attr('fill', c).attr('stroke', '#fff').attr('stroke-opacity', 0.15);
    }
    if (d.type !== 'function') {
      el.append('text').attr('dy', r + 13).attr('text-anchor', 'middle')
        .attr('font-size', d.type === 'service' ? 12 : 10)
        .attr('fill', '#cbd5e1')
        .text(d.label || d.id);
    }
  });

  simulation.on('tick', () => {
    link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
        .attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function showTooltip(event, d) {
  const tt = document.getElementById('tooltip');
  let html = `<div class="tt-type">${d.type}</div><div class="tt-label">${d.label || d.id}</div>`;
  if (d.description) html += `<div class="tt-desc">${d.description}</div>`;
  if (d.file) html += `<div class="tt-file">${d.file}${d.line ? ':'+d.line : ''}</div>`;
  if (d.sprint) html += `<div class="tt-sprint">Sprint ${d.sprint}</div>`;
  if (d.type === 'decision') {
    html += `<div class="tt-decision">`;
    if (d.choice) html += `<b>Choice:</b> ${d.choice}<br>`;
    if (d.reason) html += `<b>Why:</b> ${d.reason}<br>`;
    if (d.alternatives_rejected) html += `<b>Rejected:</b> ${d.alternatives_rejected.join(', ')}`;
    html += `</div>`;
  }
  tt.innerHTML = html;
  tt.style.opacity = 1;
  moveTooltip(event);
}
function moveTooltip(event) {
  const tt = document.getElementById('tooltip');
  const x = event.clientX + 14, y = event.clientY - 10;
  tt.style.left = Math.min(x, window.innerWidth - 300) + 'px';
  tt.style.top = Math.min(y, window.innerHeight - 200) + 'px';
}
function hideTooltip() { document.getElementById('tooltip').style.opacity = 0; }

function dragStart(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; }
function dragged(event, d) { d.fx=event.x; d.fy=event.y; }
function dragEnd(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }
function resetZoom() { svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity); }

window.addEventListener('resize', () => {
  const h = window.innerHeight - document.querySelector('#header').offsetHeight - document.querySelector('#legend').offsetHeight;
  svg.attr('width', window.innerWidth).attr('height', h);
  if (simulation) simulation.force('center', d3.forceCenter(window.innerWidth/2, h/2)).alpha(0.3).restart();
});

init();
</script>
</body>
</html>
