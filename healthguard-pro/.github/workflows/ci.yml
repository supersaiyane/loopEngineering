name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Auth Service (Go) ──────────────────────────────────────────────────────
  auth-service:
    name: auth-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthguard_test
          POSTGRES_USER: healthguard
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/auth-service/go.sum

      - name: Apply schema
        run: psql "postgres://healthguard:test_password@localhost:5432/healthguard_test" -f docs/schema/postgres.sql

      - name: go vet
        working-directory: services/auth-service
        run: go vet ./...

      - name: Run tests (with -race)
        working-directory: services/auth-service
        env:
          DATABASE_URL: postgres://healthguard:test_password@localhost:5432/healthguard_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_32_chars_minimum_xx
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_RP_ORIGIN: http://localhost:3000
          ENVIRONMENT: test
        run: go test ./... -v -race -count=1 -coverprofile=coverage.out

      - name: Check coverage ≥ 70%
        working-directory: services/auth-service
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

  # ── Patient Data Service (Go) — Sprint 2 ─────────────────────────────────
  patient-data-service:
    name: patient-data-service
    runs-on: ubuntu-latest
    if: hashFiles('services/patient-data-service/go.mod') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/patient-data-service/go.sum
      - name: go vet
        working-directory: services/patient-data-service
        run: go vet ./...
      - name: Run tests
        working-directory: services/patient-data-service
        run: go test ./... -v -race -count=1

  # ── Sepsis Scoring Service (Python) — Sprint 2 ────────────────────────────
  sepsis-scoring:
    name: sepsis-scoring-service
    runs-on: ubuntu-latest
    if: hashFiles('services/sepsis-scoring-service/requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/sepsis-scoring-service/requirements.txt
      - name: Install dependencies
        working-directory: services/sepsis-scoring-service
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: services/sepsis-scoring-service
        run: pytest -v --tb=short

  # ── Terraform Validation ───────────────────────────────────────────────────
  terraform:
    name: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.x"
      - name: Validate us-east-1
        working-directory: infra/terraform/us-east-1
        run: terraform init -backend=false && terraform validate
      - name: Validate eu-west-1
        working-directory: infra/terraform/eu-west-1
        run: terraform init -backend=false && terraform validate

  # ── Security Scan ─────────────────────────────────────────────────────────
  security:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SAST (semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/golang
            p/owasp-top-ten
            p/cwe-top-25
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── All checks must pass before merge ─────────────────────────────────────
  all-checks:
    name: all-checks-pass
    runs-on: ubuntu-latest
    needs: [auth-service, terraform, security]
    steps:
      - run: echo "All required checks passed ✅"
